name: validate
on: [push, pull_request]
jobs:
  flows-and-diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install jsonschema pyyaml
      - run: python3 tools/validate_flows.py --dir examples --registry examples/registry-stub.yaml
      - run: python3 tools/validate_diagram.py --root . examples/views/security-review.view.yaml --flows-dir examples
